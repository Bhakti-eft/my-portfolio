<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

      content="Flutter, Node.js, Python/Django and IoT developer with live production apps on Google Play and the App Store."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bhakti Priya Mohanta — Software Developer" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bhakti Priya Mohanta",
        "jobTitle": "Software Developer",
        "url": "%VITE_SITE_URL%/",
        "email": "mailto:bhakti.priya68@gmail.com",
        "image": "%VITE_SITE_URL%/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bhubaneswar",
          "addressRegion": "Odisha",
          "addressCountry": "IN"
        },
        "worksFor": { "@type": "Organization", "name": "Quotus Software Solutions Pvt. Ltd." },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Utkal University" },
          { "@type": "CollegeOrUniversity", "name": "GITA Autonomous College" },
          { "@type": "CollegeOrUniversity", "name": "NIIS Group of Institutions" }
        ],
        "knowsAbout": ["Flutter", "Node.js", "Python", "Django", "PostgreSQL", "MongoDB", "Firebase", "IoT", "ESP32"],
        "sameAs": ["https://www.linkedin.com/in/bhakti-priya-oc30", "https://github.com/Bhakti-eft"]
      }
    </script>

    <!-- Apply saved theme before paint to avoid a light/dark flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">

    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
